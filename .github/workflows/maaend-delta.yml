name: 生成 MaaEnd 增量包并上传下载站

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: 起始官方版本（如 v2.31.0）
        required: true
        type: string
      target_tag:
        description: 目标官方版本（如 v3.0.0）
        required: true
        type: string
      arch:
        description: 安装架构
        type: choice
        default: x64
        options: [x64, arm64]
      channel:
        description: 下载站发布通道
        type: choice
        default: stable
        options: [stable, beta]

permissions:
  contents: read

concurrency:
  group: maaend-delta-${{ inputs.arch }}-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'AUTO-MAS-Project/AUTO-MAS-Copilot-Data' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: 下载官方包并生成、校验增量
        env:
          BASE_TAG: ${{ inputs.base_tag }}
          TARGET_TAG: ${{ inputs.target_tag }}
          ARCH: ${{ inputs.arch == 'x64' && 'x86_64' || 'aarch64' }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: >-
          python -m copilot_data.maaend_delta --base-tag "$BASE_TAG"
          --target-tag "$TARGET_TAG" --arch "$ARCH" --output .delta-output
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maaend-${{ inputs.arch }}-${{ inputs.channel }}-delta
          path: .delta-output/maaend.delta.zip
          if-no-files-found: error
          retention-days: 7
      - name: 安装发布工具依赖
        run: python -m pip install httpx==0.28.1
      - name: 上传独立增量文件并回读校验
        env:
          AUTOMAS_TOKEN: ${{ secrets.AUTOMAS_MAAEND_DELTA_TOKEN }}
          AUTOMAS_FILE_ID: ${{ vars[format('MAAEND_DELTA_{0}_{1}_FILE_ID', inputs.arch, inputs.channel)] }}
          AUTOMAS_PUBLIC_URL: https://data.auto-mas.top/api/v1/files/auto-mas/Client/maaend-${{ inputs.arch }}-${{ inputs.channel }}-delta/download
          PYTHONPATH: src
        run: >-
          python -c "import asyncio; from pathlib import Path;
          from copilot_data.publish import publish;
          asyncio.run(publish(Path('.delta-output/maaend.delta.zip')))"
